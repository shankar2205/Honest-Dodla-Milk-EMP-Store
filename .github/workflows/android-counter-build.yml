name: Android Counter Build

on:
  push:
    branches:
      - feature/android-counter
      - feature/android-counter-clean
  pull_request:
    branches:
      - Main
      - feature/android-counter
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-counter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          gradle :app:assembleDebug \
            -PSUPABASE_URL="${SUPABASE_URL}" \
            -PSUPABASE_PUBLISHABLE_KEY="${SUPABASE_PUBLISHABLE_KEY}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: honest-milk-counter-debug-apk
          path: android-counter/app/build/outputs/apk/debug/app-debug.apk
