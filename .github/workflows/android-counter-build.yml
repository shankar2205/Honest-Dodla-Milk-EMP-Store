name: Android Counter Build

on:
  push:
    branches: [Main, feature/android-counter, feature/android-counter-clean]
  pull_request:
    branches: [Main, feature/android-counter]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-counter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          gradle :app:assembleDebug -PSUPABASE_URL="${SUPABASE_URL}" -PSUPABASE_PUBLISHABLE_KEY="${SUPABASE_PUBLISHABLE_KEY}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: honest-milk-counter-debug-apk
          path: android-counter/app/build/outputs/apk/debug/app-debug.apk

      # Release signing is optional until the repository secrets are configured.
      - name: Check release signing configuration
        id: signing-check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && \
             [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && \
             [ -n "$ANDROID_KEY_ALIAS" ] && \
             [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release signing is not configured; skipping the release APK."
          fi

      - name: Prepare release keystore
        if: steps.signing-check.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/honest-milk-counter-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/honest-milk-counter-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: steps.signing-check.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          gradle :app:assembleRelease -PSUPABASE_URL="${SUPABASE_URL}" -PSUPABASE_PUBLISHABLE_KEY="${SUPABASE_PUBLISHABLE_KEY}"

      - name: Upload signed release APK
        if: steps.signing-check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: honest-milk-counter-release-apk
          path: android-counter/app/build/outputs/apk/release/app-release.apk

      - name: Remove temporary signing key
        if: always() && steps.signing-check.outputs.ready == 'true'
        working-directory: ${{ runner.temp }}
        run: rm -f honest-milk-counter-release.jks
